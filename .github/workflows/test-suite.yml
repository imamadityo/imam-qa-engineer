name: QA Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  web-automation:
    name: Web Automation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: 03-Web-Automation
        run: npm ci
      - name: Install Playwright browsers
        working-directory: 03-Web-Automation
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        working-directory: 03-Web-Automation
        run: npx playwright test
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: 03-Web-Automation/playwright-report/
          retention-days: 30

  mobile-testing:
    name: Mobile Emulation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        working-directory: 03-Web-Automation
        run: npm ci && npx playwright install --with-deps
      - name: Run Mobile Tests
        working-directory: 03-Web-Automation
        run: npx playwright test ../04-Mobile-Testing/tests/

  api-testing:
    name: API Tests (Newman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra
      - name: Run Newman
        run: |
          newman run 02-API-Testing/postman/RestfulBooking.postman_collection.json \
            -e 02-API-Testing/postman/Staging.postman_environment.json \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export 02-API-Testing/newman/report.html
      - name: Upload Newman Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-report
          path: 02-API-Testing/newman/report.html
          retention-days: 30

  security-testing:
    name: Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        working-directory: 03-Web-Automation
        run: npm ci && npx playwright install --with-deps
      - name: Run Security Tests
        working-directory: 03-Web-Automation
        run: npx playwright test ../06-Security-Testing/tests/

  performance-testing:
    name: Performance Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install K6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install k6
      - name: Run K6 Load Test
        run: k6 run 07-Performance-Testing/k6/load-test.js
      - name: Upload K6 Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-report
          path: 07-Performance-Testing/reports/
          retention-days: 30