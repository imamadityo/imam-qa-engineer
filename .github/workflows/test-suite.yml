name: QA Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  web-automation:
    name: Web Automation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: 03-Web-Automation
        run: npm ci
      - name: Install Playwright browsers
        working-directory: 03-Web-Automation
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        working-directory: 03-Web-Automation
        run: npx playwright test
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: 03-Web-Automation/playwright-report/
          retention-days: 30

  api-testing:
    name: API Tests (Newman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Newman
        run: npm install newman newman-reporter-htmlextra
      - name: Run Newman
        run: |
          npx newman run 02-API-Testing/postman/RestfulBooking.postman_collection.json \
            -e 02-API-Testing/postman/Staging.postman_environment.json \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export 02-API-Testing/newman/report.html
      - name: Upload Newman Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-report
          path: 02-API-Testing/newman/report.html
          retention-days: 30

  deploy-report:
    name: Deploy Reports to GitHub Pages
    needs: [web-automation, api-testing]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Playwright Report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: reports/playwright/
      - name: Download Newman Report
        uses: actions/download-artifact@v4
        with:
          name: newman-report
          path: reports/newman/
      - name: Create index page
        run: |
          cat > reports/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="id">
          <head>
            <meta charset="UTF-8">
            <title>QA Portfolio - Test Reports</title>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; padding: 40px 20px; }
              .container { max-width: 800px; margin: 0 auto; }
              h1 { color: #333; margin-bottom: 30px; text-align: center; }
              .card { background: white; border-radius: 12px; padding: 30px; margin: 20px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
              .card h2 { color: #2196F3; margin-bottom: 10px; }
              .card p { color: #666; margin-bottom: 15px; }
              .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; color: white; font-size: 13px; font-weight: bold; }
              .pass { background: #4CAF50; }
              a.btn { display: inline-block; background: #2196F3; color: white; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-weight: bold; }
              a.btn:hover { background: #1976D2; }
              .stats { text-align: center; margin: 30px 0; }
              .stats .number { font-size: 48px; font-weight: bold; color: #4CAF50; }
              .stats .label { color: #666; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>QA Portfolio - Test Reports</h1>
              <div class="stats">
                <div class="number">42+</div>
                <div class="label">Automated Tests</div>
              </div>
              <div class="card">
                <h2>Playwright HTML Report</h2>
                <p>Web Automation, Mobile, Security, Database tests</p>
                <span class="badge pass">42 Tests - All Pass</span>
                <br><br>
                <a class="btn" href="./playwright/index.html">View Report</a>
              </div>
              <div class="card">
                <h2>Newman API Report</h2>
                <p>Restful Booker API - Full CRUD + Negative Tests</p>
                <span class="badge pass">28 Assertions - All Pass</span>
                <br><br>
                <a class="btn" href="./newman/report.html">View Report</a>
              </div>
            </div>
          </body>
          </html>
          EOF
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports